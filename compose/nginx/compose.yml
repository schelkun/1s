# Shared Nginx reverse proxy.
#
# Runs with host networking so it can bind the exact public IPv4/IPv6 addresses
# from the configuration and see real client addresses. Applications are only
# published on 127.0.0.1, so there is no Docker network shared between stacks.
#
# The configuration is rendered by scripts/lib/nginx.sh into generations under
# ${ONES_ETC}/nginx/generations/<id>; "current" is an atomically swapped symlink.
name: ${ONES_PREFIX:-1s}-nginx

services:
  nginx:
    image: ${NGINX_IMAGE:?NGINX_IMAGE is required}
    container_name: ${ONES_PREFIX:-1s}-nginx
    network_mode: host
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/1s/current/nginx.conf"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=256m
      - /run:size=1m
      - /tmp:size=16m
    volumes:
      - ${ONES_ETC:-/etc/1s}/nginx:/etc/nginx/1s:ro
      - ${ONES_ETC:-/etc/1s}/tls:/etc/nginx/tls:ro
      - ${ONES_VAR:-/var/lib/1s}/acme-webroot:/var/www/acme:ro
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
