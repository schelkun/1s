# HTTP-01 challenges and a local health endpoint. Both are reachable from any
# address on purpose: they expose nothing from the protected applications.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
}

location = /.1s/healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
