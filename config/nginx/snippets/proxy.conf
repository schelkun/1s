# Reverse proxy defaults: HTTP/1.1 upstream, WebSockets, long-running
# connections and streaming (SSE). Client-supplied forwarding headers are
# overwritten, never appended, so they cannot be spoofed through this proxy.
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header Forwarded         "";
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout 10s;
proxy_read_timeout    3600s;
proxy_send_timeout    3600s;
send_timeout          3600s;

proxy_buffering         off;
proxy_request_buffering off;
proxy_redirect          off;
