# Main Nginx configuration (template).
# Rendered by scripts/lib/nginx.sh: @GEN@ is replaced with the generation path,
# @REAL_IP@ with the trusted-proxy block (empty by default).
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 8192;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    types_hash_max_size 4096;
    server_names_hash_bucket_size 128;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    log_format main '$remote_addr [$time_local] $host:$server_port "$request" '
                    '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    # WebSocket upgrade handling.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Client IP handling. Default: no trusted proxies, $remote_addr is the TCP
    # peer and X-Forwarded-For from clients is ignored (and overwritten below).
@REAL_IP@

    include @GEN@/snippets/tls.conf;
    include @GEN@/servers/*.conf;
}
